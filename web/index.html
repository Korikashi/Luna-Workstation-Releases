<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{SITE_NAME}} — Local Remote Desktop sessions for Windows</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="author" content="{{DEVELOPER}}" />
    <meta name="theme-color" content="#141418" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="{{SITE_URL}}" />

    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="%BASE_URL%icon-256.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:title" content="{{SITE_NAME}} {{VERSION}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <meta property="og:image" content="{{SITE_URL}}og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Luna WorkStation official icon and name" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_NAME}} {{VERSION}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_URL}}og-image.png" />

    <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 16px; color: #ececf1; background: #141418; font-family: 'Segoe UI', sans-serif">
        Luna WorkStation for Windows —
        <a style="color: #fea1a9" href="{{DOWNLOAD_URL}}">Download the installer</a>
        ·
        <a style="color: #fea1a9" href="{{REPOSITORY_URL}}">GitHub repository</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
